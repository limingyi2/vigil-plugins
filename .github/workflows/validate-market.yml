name: Validate market packages
on: [push, pull_request]
jobs:
  wallpaper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild from committed source and check the published manifest and ZIP
        run: |
          python tools/package_plugin.py wallpaper HEAD
          git diff --exit-code -- market.json plugins/wallpaper/
